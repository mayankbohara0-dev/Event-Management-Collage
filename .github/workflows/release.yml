name: Build & Release ZEST APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./event_app
        run: flutter pub get

      - name: Analyze code
        working-directory: ./event_app
        run: flutter analyze

      - name: Build Release APK
        working-directory: ./event_app
        run: |
          flutter build apk --release

      - name: Rename APK for Release
        run: |
          mkdir -p release-assets
          cp event_app/build/app/outputs/flutter-apk/app-release.apk release-assets/zest-v${{ github.ref_name }}.apk || cp event_app/build/app/outputs/flutter-apk/app-release.apk release-assets/zest-app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
