name: zest_app
description: "Add some zest to your campus life — the ultimate college event platform."
# The following line prevents the package from being accidentally published to
# pub.dev using lutter pub publish. This is preferred for private packages.
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.4.0
  supabase_flutter: ^2.17.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  image_picker: ^1.2.3
  file_picker: ^11.0.3
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  shimmer: ^3.0.0
  csv: ^8.0.0
  add_2_calendar: ^3.1.1
  universal_html: ^2.3.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/brand/
    - assets/images/
    - assets/fonts/

  fonts:
    # Bricolage Grotesque — ExtraBold (w800) for all display/heading text
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    # Inter Variable — supports all weights 100-900 via single variable font
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 100
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 200
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 300
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/logo_icon_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#B8FF1A"
  adaptive_icon_foreground: "assets/brand/logo_icon_1024.png"
